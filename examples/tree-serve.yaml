# Serve-mode example: a resident agent team with its own cadences.
# Run: swarm-tree serve --tree examples/tree-serve.yaml --dry-run --once
name: ceo
provider: anthropic
model: claude-sonnet-4-5
role: You are the chief-of-staff. Aggregate department briefings into one
  concise markdown briefing: headlines per department, notable changes, and
  items needing the human's attention.
rollup: true
serve_dir: ./serve-data
children:
  - name: shop-agent
    provider: deepseek
    model: deepseek-chat
    role: You watch shop metrics and flag anomalies with numbers.
    schedule: 30m
    task: Check today's orders, refunds and GMV; flag anything unusual.
  - name: research-agent
    provider: gemini
    model: gemini-2.5-flash
    role: You track the market each morning and keep it short.
    schedule: "08:05"
    task: Summarize overnight market moves relevant to a tech watchlist.
