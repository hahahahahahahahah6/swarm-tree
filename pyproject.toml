[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "swarm-tree"
version = "0.2.1"
description = "Hierarchical multi-agent orchestration: a tree of LLM agents, each node backed by a different provider"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "hao li" }]
keywords = ["agents", "multi-agent", "orchestration", "llm", "swarm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"

[project.scripts]
swarm-tree = "swarm_tree.cli:main"

[project.optional-dependencies]
yaml = ["pyyaml>=6"]

[tool.setuptools.packages.find]
where = ["src"]
